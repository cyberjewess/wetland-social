version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: wetland-social-dev
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent node_modules and .next from being overwritten
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: wetland-social-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
